name: Deploy editor to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package static editor
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Stage browser runtime only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html capabilities-status.json design-canvas.state.json _site/
          for dir in core css data domains editor formats geometry hud integration js macro runtime vendor; do
            test -d "$dir"
            cp -R "$dir" "_site/$dir"
          done
          touch _site/.nojekyll

      - name: Validate deployable site and excluded fixtures
        run: node tools/verify-pages-site.mjs _site

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    name: Publish GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
